name: CI + AI Failure Analyzer

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

  # ─── Job 2: AI Failure Analyzer ──────────────────────────────────────────────
  # Triggered only when the build job fails (if: failure()).
  # Downloads CI logs, runs RAG + Gemini analysis, notifies Slack for approval.
  # Uploads analysis.json as an artifact for the next job to consume.
  analyze-failure:
    name: analyze-failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install google-genai==2.20.0

      - name: Download failed build job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "build") | .id')

          echo "Build job ID: $JOB_ID"

          gh api /repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs \
            --allow-escape-sequences \
            > ci_failure.log

          echo "Log downloaded: $(wc -l < ci_failure.log) lines"

      # Simultaneously applies:
      #   Tool 1 — GitHub API  : CI logs already downloaded above
      #   Tool 2 — RAG / KB    : keyword-scored knowledge base search in script
      #   Tool 3 — Gemini      : root cause analysis + PR description in one call
      - name: "Step 1 — AI Log Analysis (RAG + Gemini)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RUN_ID: ${{ github.run_id }}
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/analyze_log.py

      # Tool 4 — Slack MCP: post structured diagnosis and request human YES/NO
      - name: "Step 1b — Notify Slack (Approval Required)"
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TYPE: "approval"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py

      # Pass analysis.json to the approval job without re-running the analysis
      - name: Upload analysis artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-analysis
          path: analysis.json
          retention-days: 1

  # ─── Job 3: Human Approval Gate ──────────────────────────────────────────────
  # Pauses here until a human approves or rejects in GitHub Actions.
  # Requires the "fix-approval" environment to be created in repo Settings →
  # Environments → fix-approval → Required reviewers.
  #
  # YES (approved) → runs Step 2 (create PR) + notifies Slack (success)
  # NO  (rejected) → job is skipped; notify-rejection job sends Slack notification
  approve-and-fix:
    name: approve-and-fix
    needs: analyze-failure
    if: needs.analyze-failure.result == 'success'
    runs-on: ubuntu-latest
    environment: fix-approval
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-analysis

      # Tool 5 — GitHub MCP: apply file patch + create fix PR
      - name: "Step 2 — Create Fix PR (git + gh)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/create_pr.py

      # Tool 4 — Slack MCP: confirm PR was created
      - name: "Step 2b — Notify Slack (PR Created)"
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TYPE: "success"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py

  # ─── Job 4: Rejection Notification ───────────────────────────────────────────
  # Runs only when the approval job was rejected or timed out.
  # Sends a Slack message asking the human to fix the failure manually.
  notify-rejection:
    name: notify-rejection
    needs: approve-and-fix
    if: needs.approve-and-fix.result == 'failure' || needs.approve-and-fix.result == 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-analysis
        continue-on-error: true

      # Tool 4 — Slack MCP: inform team that fix was not approved
      - name: "Notify Slack (Fix Rejected)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TYPE: "rejected"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py
