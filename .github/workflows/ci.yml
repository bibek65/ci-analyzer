name: CI + AI Failure Analyzer

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Demo scenario to inject"
        required: true
        default: "npm-conflict"
        type: choice
        options:
          - npm-conflict        # KB HIT  — react peer dependency mismatch
          - missing-script      # KB HIT  — package.json missing start script
          - bad-json            # NO HIT  — malformed package.json syntax
          - wrong-engine        # NO HIT  — node engine version constraint fails

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      # Inject the chosen demo scenario before running npm install.
      # On a push (not workflow_dispatch) the default bug in package.json is used.
      - name: Inject demo scenario
        if: github.event_name == 'workflow_dispatch'
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          echo "Injecting scenario: $SCENARIO"
          case "$SCENARIO" in

            npm-conflict)
              # KB HIT — react@17 + react-dom@18 peer conflict (matches 'nodejs' KB entry)
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
                pkg.dependencies = pkg.dependencies || {};
                pkg.dependencies['react'] = '17.0.2';
                pkg.dependencies['react-dom'] = '18.0.0';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              "
              ;;

            missing-script)
              # KB HIT — removes the "start" script so npm start fails (matches 'nodejs' KB)
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
                pkg.scripts = {};
                pkg.dependencies = { 'express': '4.18.0' };
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              "
              # Also create a fake index.js that requires a module that doesn't exist
              echo "require('nonexistent-module');" > src/index.js
              ;;

            bad-json)
              # NO KB HIT — corrupts package.json with invalid JSON (agent must reason alone)
              echo '{ "name": "ci-analyzer-demo", "version": "1.0.0", INVALID_JSON }' > package.json
              ;;

            wrong-engine)
              # NO KB HIT — sets engines.node to an old unsupported version (agent must reason alone)
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
                pkg.engines = { 'node': '>=8.0.0 <12.0.0' };
                pkg.dependencies = { 'react': '18.0.0', 'react-dom': '18.0.0' };
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              "
              # Force npm to respect the engine constraint
              echo 'engine-strict=true' > .npmrc
              ;;
          esac

          echo "--- package.json after injection ---"
          cat package.json

      - name: Install dependencies
        run: npm install

  # ─── Job 2: AI Failure Analyzer ──────────────────────────────────────────────
  analyze-failure:
    name: analyze-failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install google-genai==2.20.0 chromadb==1.0.0

      - name: Download failed build job logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOB_ID=$(gh api \
            /repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name == "build") | .id')

          echo "Build job ID: $JOB_ID"

          gh api /repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs \
            --allow-escape-sequences \
            > ci_failure.log

          echo "Log downloaded: $(wc -l < ci_failure.log) lines"

      - name: "Step 1 — AI Agent: analyze (read_ci_logs → search_knowledge_base → write_analysis)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
          CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
          CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          DEMO_SCENARIO: ${{ github.event.inputs.scenario }}
          AGENT_MODE: "analyze"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/agent.py

      - name: "Step 1b — Notify Slack (Approval Required)"
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEMO_SCENARIO: ${{ github.event.inputs.scenario }}
          NOTIFICATION_TYPE: "approval"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py

      - name: Upload analysis artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-analysis
          path: analysis.json
          retention-days: 1

  # ─── Job 3: Human Approval Gate ──────────────────────────────────────────────
  approve-and-fix:
    name: approve-and-fix
    needs: analyze-failure
    if: always() && needs.analyze-failure.result == 'success'
    runs-on: ubuntu-latest
    environment: fix-approval
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-analysis

      - name: Install dependencies
        run: pip install google-genai==2.20.0 chromadb==1.0.0

      - name: "Step 2 — AI Agent: fix (read_analysis → apply_patch → create_pull_request)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          AGENT_MODE: "fix"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/agent.py

      - name: "Step 2b — Notify Slack (PR Created)"
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TYPE: "success"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py

  # ─── Job 4: Rejection Notification ───────────────────────────────────────────
  notify-rejection:
    name: notify-rejection
    needs: approve-and-fix
    if: always() && (needs.approve-and-fix.result == 'failure' || needs.approve-and-fix.result == 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Download analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-analysis
        continue-on-error: true

      - name: "Notify Slack (Fix Rejected)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TYPE: "rejected"
          PYTHONUNBUFFERED: "1"
        run: python3 .github/scripts/notify_slack.py
